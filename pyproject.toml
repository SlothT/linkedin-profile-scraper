[project]
name = "linkedin-profile-api"
version = "1.0.0"
description = "HTTPS API that returns a LinkedIn profile as structured JSON"
requires-python = ">=3.13"
dependencies = [
    "cachetools>=7.1.7",
    "curl-cffi>=0.16.2",
    "fastapi>=0.141.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "slowapi>=0.1.10",
    "uvicorn[standard]>=0.52.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.5",
]
